global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: evalflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: evalflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9808"]
