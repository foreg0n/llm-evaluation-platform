groups:
  - name: evalflow-availability
    rules:
      - alert: EvalflowApiDown
        expr: up{job="evalflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Evalflow API metrics target is down
          description: Prometheus has not scraped the Evalflow API for one minute.

      - alert: EvalflowWorkerDown
        expr: up{job="evalflow-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Evalflow Celery worker metrics target is down
          description: The worker metrics listener has been unreachable for two minutes.

      - alert: EvalflowReadinessFailure
        expr: increase(evalflow_readiness_checks_total{status=~"unreachable"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Evalflow readiness dependency failed
          description: A recent readiness probe reported an unreachable dependency.

  - name: evalflow-performance
    rules:
      - alert: EvalflowHighHttpErrorRate
        expr: |
          sum(rate(evalflow_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(evalflow_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Evalflow HTTP 5xx rate is above 5%
          description: More than 5% of API requests have returned 5xx for five minutes.

      - alert: EvalflowHighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(evalflow_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Evalflow API p95 latency is above two seconds
          description: The API p95 request duration has exceeded two seconds for ten minutes.

      - alert: EvalflowEvaluationRunFailed
        expr: increase(evalflow_evaluation_runs_total{outcome="failed"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An Evalflow evaluation run failed
          description: At least one evaluation run reached the failed state in the last ten minutes.

      - alert: EvalflowCeleryTaskFailed
        expr: increase(evalflow_celery_tasks_total{outcome="failed"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An Evalflow Celery task failed
          description: At least one durable worker task failed in the last ten minutes.
