[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-platform"
version = "0.20.0"
description = "A full-stack platform for evaluating language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.116,<1",
    "litellm>=1.93,<2",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "rich>=13.9,<15",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*", "evals*"]
