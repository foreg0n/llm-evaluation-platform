[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-platform"
version = "0.37.0"
description = "A full-stack multi-provider platform for evaluating language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "cryptography>=46,<51",
    "fastapi>=0.116,<1",
    "litellm>=1.93,<2",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-celery>=0.65b0,<0.66",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-sdk>=1.44,<2",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "prometheus-client>=0.26,<1",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "rich>=13.9,<15",
    "sentry-sdk[celery,fastapi]>=2.66.1,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx2>=2.12,<3",
    "PyYAML>=6,<7",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools.packages.find]
include = ["backend*", "evals*"]
