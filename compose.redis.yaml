services:
  redis:
    image: redis:8.2-alpine
    container_name: llm-eval-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - llm-eval-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  llm-eval-redis-data:
