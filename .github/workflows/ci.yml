name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python packages
        run: python -m compileall -q backend evals
      - name: Run network-free test suite
        env:
          TRACING_ENABLED: "false"
          SENTRY_ENABLED: "false"
          REQUIRE_EMAIL_VERIFICATION: "false"
          EMAIL_BACKEND: console
        run: python -m pytest
      - name: Render complete Alembic SQL chain
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evalflow_ci
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        run: alembic upgrade head --sql > "${RUNNER_TEMP}/alembic.sql"

  frontend:
    name: Frontend lint, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build and test production frontend
        run: npm test

  configuration:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate full-stack Compose file
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET_KEY: ci-auth-secret-key-with-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        run: docker compose config --quiet
      - name: Validate production Compose file
        env:
          APP_DOMAIN: evalflow.example.com
          ACME_EMAIL: ops@example.com
          EVALFLOW_API_IMAGE: ghcr.io/example/evalflow-api:ci
          EVALFLOW_FRONTEND_IMAGE: ghcr.io/example/evalflow-frontend:ci
          EVALFLOW_BACKUP_IMAGE: ghcr.io/example/evalflow-backup:ci
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RESTIC_REPOSITORY: /repository
          RESTIC_PASSWORD: ci-restic-password
          AUTH_SECRET_KEY: ci-auth-secret-key-with-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        run: docker compose -f compose.production.yaml config --quiet
      - name: Validate backup drill Compose file
        run: docker compose -f compose.backup-drill.yaml config --quiet
      - name: Validate deployment and backup shell syntax
        run: |
          bash -n infra/provision-ubuntu.sh deploy/scripts/deploy-production.sh
          for script in deploy/backup/scripts/*.sh; do sh -n "$script"; done
      - name: Validate Caddy HTTPS configuration
        run: >-
          docker run --rm
          --env APP_DOMAIN=evalflow.example.com
          --env ACME_EMAIL=ops@example.com
          --volume "${PWD}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backup-restore:
    name: PostgreSQL backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, configuration]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Create encrypted backup and verify isolated restore
        run: |
          docker compose -f compose.backup-drill.yaml build migrate backup restore-drill
          docker compose -f compose.backup-drill.yaml up --detach --wait source-postgres restore-postgres
          docker compose -f compose.backup-drill.yaml run --rm --no-deps migrate
          docker compose -f compose.backup-drill.yaml run --rm --no-deps backup
          docker compose -f compose.backup-drill.yaml run --rm --no-deps restore-drill
      - name: Inspect drill containers
        if: always()
        run: docker compose -f compose.backup-drill.yaml ps -a
      - name: Remove drill containers and volumes
        if: always()
        run: docker compose -f compose.backup-drill.yaml down --volumes --remove-orphans

  containers:
    name: Build production containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, configuration, backup-restore]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --tag evalflow-api:ci .
      - name: Build frontend image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
          --tag evalflow-frontend:ci
          ./frontend
      - name: Build backup image
        run: docker build --tag evalflow-backup:ci ./deploy/backup
      - name: Inspect built images
        run: >-
          docker image inspect
          evalflow-api:ci evalflow-frontend:ci evalflow-backup:ci > /dev/null
