version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vinext-rsc:
        patterns:
          - vinext
          - "@vitejs/plugin-rsc"
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: eslint
        versions:
          - ">=10.0.0"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
